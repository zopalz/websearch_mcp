[project]
name = "duckduckgo-mcp-server"
version = "0.1.0"
description = "MCP server for DuckDuckGo web search, image search, and image downloads"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckduckgo_search>=6.0.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
duckduckgo-mcp = "server:main"
